name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # tests/harness.lua resolves `sai.*` requires through the parent of the
    # checkout: the repo must be checked out into a directory named `sai`
    defaults:
      run:
        working-directory: sai
    steps:
      - uses: actions/checkout@v7
        with:
          path: sai
      # the nvim_dap job installs the same set: the runner image pins the
      # distro packages, so both jobs see the same toolchain
      # lua-cjson: 5.1-abi module, loadable by luajit
      # libxkbcommon-dev: ffi.load('xkbcommon') resolves to libxkbcommon.so,
      # which only the dev package provides (the runtime lib is .so.0)
      # libluajit-5.1-dev: headers for compiling the bridge .so modules
      - name: Install luajit toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq luajit libluajit-5.1-dev libxkbcommon-dev lua-cjson
      - name: tests
        run: timeout 300 luajit tests/init.lua

      - name: Download stylua
        run: |
          curl -fsSL https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip -o /tmp/stylua.zip
          unzip -o /tmp/stylua.zip -d "$RUNNER_TEMP/stylua-bin"
          echo "$RUNNER_TEMP/stylua-bin" >> "$GITHUB_PATH"
      - name: stylua
        run: stylua --check .

      - name: Download lua-language-server
        env:
          # pinned: the lint results are verified against this exact version
          LLS_VERSION: 3.19.1
        run: |
          # the tarball ships the binary together with its support files:
          # keep the whole tree, only bin/ goes on PATH
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/${LLS_VERSION}/lua-language-server-${LLS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/bin/lua-language-server"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # --check does not load workspace.library entries: the definitions
      # must live inside the checked workspace (the .luarc.json library
      # paths only serve local editor sessions)
      - name: Fetch swayimg API definitions
        run: curl -fsSL https://raw.githubusercontent.com/artemsen/swayimg/master/extra/swayimg.lua -o swayimg.lua

      # require a verdict line so an lls crash cannot pass as green
      - name: lua-language-server
        run: |
          lua-language-server --checkmode=global --check=. --logpath="$RUNNER_TEMP/lslog" 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' > "$RUNNER_TEMP/lsreport.txt"
          cat "$RUNNER_TEMP/lsreport.txt"
          grep -q 'Diagnosis complet' "$RUNNER_TEMP/lsreport.txt"
          ! grep -qE '\[(Warning|Error)\]' "$RUNNER_TEMP/lsreport.txt"

  # the dap end-to-end test needs a wayland session: weston's headless
  # backend runs in memory on the gpu-less runner (pixman software
  # rendering, no input devices) - its documented purpose is client testing
  nvim_dap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sai
    steps:
      - uses: actions/checkout@v7
        with:
          path: sai
      - name: Config dir symlink
        run: |
          # the test spawns processes that resolve `sai.*` through the
          # swayimg config dir: mirror the local ~/.config/swayimg/sai layout
          mkdir -p "$HOME/.config"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.config/swayimg"

      - name: Install session dependencies
        env:
          # pinned: nvim-dap/nvim-nio require a recent nvim, apt's is too old
          NVIM_VERSION: v0.12.5
        run: |
          sudo apt-get update -qq
          # weston: headless wayland session; libjpeg-dev: the generated test
          # images; luajit + lua-cjson: the test harness (as in the tests job);
          # the rest: swayimg build dependencies (master, like the api
          # definitions the luals check runs against)
          sudo apt-get install -yqq weston imagemagick \
            luajit lua-cjson \
            meson ninja-build \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libfontconfig-dev libfreetype-dev libluajit-5.1-dev libjpeg-dev
          curl -fsSL "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz" \
            | sudo tar -xz -C /opt
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

          # the paths the test's prerequisites check for
          mkdir -p "$HOME/.local/share/nvim/lazy"
          git clone --depth 1 https://github.com/mfussenegger/nvim-dap "$HOME/.local/share/nvim/lazy/nvim-dap"
          git clone --depth 1 https://github.com/nvim-neotest/nvim-nio "$HOME/.local/share/nvim/lazy/nvim-nio"
          mkdir -p "$HOME/Pictures/ci"
          convert -size 640x480 gradient:red-blue "$HOME/Pictures/ci/a.jpg"
          convert -size 640x480 gradient:green-yellow "$HOME/Pictures/ci/b.jpg"

      - name: Build swayimg
        run: |
          git clone --depth 1 https://github.com/artemsen/swayimg /tmp/swayimg
          meson setup /tmp/swayimg/build /tmp/swayimg
          sudo meson install -C /tmp/swayimg/build

      - name: Start headless weston
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          # -S: fixed socket name; -i0: no idle timeout; --no-config: plain
          # defaults, no weston.ini
          weston --backend=headless-backend.so --no-config -Swayland-0 -i0 >/tmp/weston.log 2>&1 &
          for _ in $(seq 1 100); do
            [ -S "$XDG_RUNTIME_DIR/wayland-0" ] && break
            sleep 0.1
          done
          if [ ! -S "$XDG_RUNTIME_DIR/wayland-0" ]; then cat /tmp/weston.log; exit 1; fi
          echo "WAYLAND_DISPLAY=wayland-0" >> "$GITHUB_ENV"

      - name: tests
        run: timeout 300 luajit tests/init.lua nvim_dap

      - name: Weston session log
        if: failure()
        run: cat /tmp/weston.log
