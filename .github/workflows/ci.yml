name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # swayimg's own CI builds on ubuntu 26.04: the current exiv2 API lives
    # there; ubuntu-latest runners are still on 24.04 (exiv2 0.27)
    container: ubuntu:26.04
    # harness resolves sai.* through checkout parent: directory must be named sai
    defaults:
      run:
        working-directory: sai
    steps:
      - uses: actions/checkout@v7
        with:
          path: sai
      # same toolchain in both jobs; container pins distro packages
      # cjson: luajit 5.1 ABI; xkbcommon-dev: ffi .so; luajit-dev: bridge headers
      # g++ libexiv2-dev: on-demand compile of the exiv2 bridge
      # libx11-data: xkb compose tables (bare containers lack them: segfaults)
      - name: Install luajit toolchain
        run: |
          apt-get update -qq
          apt-get install -yqq luajit libluajit-5.1-dev libxkbcommon-dev lua-cjson \
            g++ libexiv2-dev libx11-data \
            git curl unzip ca-certificates
      - name: tests
        run: timeout 300 luajit tests/init.lua

      - name: Download stylua
        run: |
          curl -fsSL https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip -o /tmp/stylua.zip
          unzip -o /tmp/stylua.zip -d "$RUNNER_TEMP/stylua-bin"
          echo "$RUNNER_TEMP/stylua-bin" >> "$GITHUB_PATH"
      - name: stylua
        run: stylua --check .

      - name: Download lua-language-server
        env:
          # pinned: results verified against this version
          LLS_VERSION: 3.19.1
        run: |
          # tarball includes support files: only bin/ goes on PATH
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/${LLS_VERSION}/lua-language-server-${LLS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/bin/lua-language-server"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # lls loads swayimg API from workspace.library, not checkout symlinks
      - name: Fetch swayimg API definitions
        run: |
          mkdir -p /usr/local/share/swayimg
          curl -fsSL https://raw.githubusercontent.com/artemsen/swayimg/master/extra/swayimg.lua -o /usr/local/share/swayimg/swayimg.lua

      # require verdict line: lls crash must not pass as green
      - name: lua-language-server
        run: |
          lua-language-server --checkmode=global --check=. --logpath="$RUNNER_TEMP/lslog" 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' > "$RUNNER_TEMP/lsreport.txt"
          cat "$RUNNER_TEMP/lsreport.txt"
          grep -q 'Diagnosis complet' "$RUNNER_TEMP/lsreport.txt"
          ! grep -qE '\[(Warning|Error)\]' "$RUNNER_TEMP/lsreport.txt"

      # separate workspace: tests/.luarc.json (sources are not visible from it)
      - name: lua-language-server tests
        working-directory: sai/tests
        run: |
          lua-language-server --checkmode=global --check=. --logpath="$RUNNER_TEMP/lslog2" 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' > "$RUNNER_TEMP/lsreport2.txt"
          cat "$RUNNER_TEMP/lsreport2.txt"
          grep -q 'Diagnosis complet' "$RUNNER_TEMP/lsreport2.txt"
          ! grep -qE '\[(Warning|Error)\]' "$RUNNER_TEMP/lsreport2.txt"

  # dap test needs weston headless session: memory rendering, no input
  nvim_dap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # same pinned distro as the tests job (see its container note)
    container: ubuntu:26.04
    defaults:
      run:
        working-directory: sai
    steps:
      - uses: actions/checkout@v7
        with:
          path: sai
      - name: Config dir symlink
        run: |
          # spawned processes resolve sai.* via config dir: mirror local layout
          mkdir -p "$HOME/.config"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.config/swayimg"

      - name: Install session dependencies
        env:
          # pinned: apt nvim is too old for nvim-dap/nvim-nio
          NVIM_VERSION: v0.12.5
        run: |
          apt-get update -qq
          # swayimg master matches the API definitions used by luals check
          apt-get install -yqq weston imagemagick \
            luajit lua-cjson \
            git curl ca-certificates \
            g++ libexiv2-dev libx11-data \
            meson ninja-build \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libfontconfig-dev libfreetype-dev libluajit-5.1-dev libjpeg-dev
          curl -fsSL "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz" \
            | tar -xz -C /opt
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          # nvim embeds upstream luajit with the upstream default cpath: the
          # distro lua-cjson (multiarch path) is invisible without a symlink
          mkdir -p /usr/local/lib/lua/5.1
          ln -s /usr/lib/x86_64-linux-gnu/lua/5.1/cjson.so /usr/local/lib/lua/5.1/cjson.so

          # test prerequisite paths
          mkdir -p "$HOME/.local/share/nvim/lazy"
          git clone --depth 1 https://github.com/mfussenegger/nvim-dap "$HOME/.local/share/nvim/lazy/nvim-dap"
          git clone --depth 1 https://github.com/nvim-neotest/nvim-nio "$HOME/.local/share/nvim/lazy/nvim-nio"
          mkdir -p "$HOME/Pictures/ci"
          convert -size 640x480 gradient:red-blue "$HOME/Pictures/ci/a.jpg"
          convert -size 640x480 gradient:green-yellow "$HOME/Pictures/ci/b.jpg"

      - name: Build swayimg
        run: |
          git clone --depth 1 https://github.com/artemsen/swayimg /tmp/swayimg
          meson setup /tmp/swayimg/build /tmp/swayimg
          meson install -C /tmp/swayimg/build

      - name: Start headless weston
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          # -S fixed socket; -i0 no idle timeout; --no-config plain defaults
          weston --backend=headless-backend.so --no-config -Swayland-0 -i0 >/tmp/weston.log 2>&1 &
          for _ in $(seq 1 100); do
            [ -S "$XDG_RUNTIME_DIR/wayland-0" ] && break
            sleep 0.1
          done
          if [ ! -S "$XDG_RUNTIME_DIR/wayland-0" ]; then cat /tmp/weston.log; exit 1; fi
          echo "WAYLAND_DISPLAY=wayland-0" >> "$GITHUB_ENV"

      - name: tests
        run: timeout 300 luajit tests/init.lua nvim_dap

      - name: Weston session log
        if: failure()
        run: cat /tmp/weston.log
